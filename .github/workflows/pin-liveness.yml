name: pin-liveness

# The app downloads its Full Mode runtime from two pinned URLs, and both live on infrastructure
# this project does not fully control: a GitHub release asset and a mirror the project owns. A pin
# whose URL stops serving the pinned bytes does not fail a build - it fails on a user's phone, as
# "Download failed: HTTP 404", after they have waited for a node to start. This checks the pins on a
# schedule so a dead URL is found here first.
#
# It downloads the artifacts rather than asking for headers: a 200 with a different body is exactly
# the failure being guarded against (a retagged release, a rewritten asset), so the digest and the
# archive layout are both checked.
#
# A red scheduled run is seen by nobody, so the outcome is also written to an issue: opened or
# updated when a pin is dead, closed again when the check passes. The run still fails either way,
# which is what keeps it visible in the repository's status.
#
# "Run workflow" with dry_run enabled answers the one question a weekly job cannot answer for itself:
# is the schedule still going to fire? That mode checks the schedule wiring - cron present, workflow
# enabled, default branch, next due time - without downloading the artifacts or touching any issue,
# so it is safe to press at any time and finishes in seconds.
on:
  schedule:
    # Weekly, Monday morning UTC. GitHub disables schedules on a repository with no activity for
    # 60 days, so a silent disable is possible; this file's dry run is how that is noticed.
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify the schedule wiring - no downloads, no issue changes
        type: boolean
        default: false

permissions:
  contents: read
  # The dry run reads the workflow's state to tell an active schedule from one GitHub disabled after
  # 60 days of inactivity; declaring any permission here sets the rest to none, so this one is needed.
  actions: read
  # The report step opens, comments on and closes the issue that tracks a dead pin.
  issues: write

jobs:
  pinned-urls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The outcome is recorded instead of failing the step, so the report step always gets a
      # chance to run; the last step fails the job afterwards.
      - name: Check the pins, or only the schedule in a dry run
        id: check
        env:
          # The dry run reads the default branch and the workflow's state from the API, and a step
          # only sees these if they are handed to it here.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "::notice title=Dry run::Verifying the weekly schedule only; no artifacts are downloaded and no issue is touched."
            if bash scripts/verify-pin-schedule.sh 2>&1 | tee pin-liveness.log; then
              echo "outcome=success" >> "$GITHUB_OUTPUT"
            else
              echo "outcome=failure" >> "$GITHUB_OUTPUT"
              echo "::error title=The weekly schedule cannot fire::See the log above."
            fi
          else
            if bash scripts/verify-pinned-runtime-urls.sh 2>&1 | tee pin-liveness.log; then
              echo "outcome=success" >> "$GITHUB_OUTPUT"
            else
              echo "outcome=failure" >> "$GITHUB_OUTPUT"
              echo "::error title=A pinned runtime URL is dead::See the issue this run reports to, or the log above."
            fi
          fi

      # A dry run must never close a real incident: pressing the button while an issue is open would
      # otherwise mark it resolved without the pins ever having been rechecked.
      - name: Report the outcome on an issue
        id: report
        if: always() && steps.check.outputs.outcome != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash scripts/report-pin-liveness.sh "${{ steps.check.outputs.outcome }}" pin-liveness.log "$RUN_URL"

      # The issue is only seen by somebody who reads GitHub notifications. This puts the failure where
      # people are, using a Slack incoming webhook held in the PIN_ALERT_WEBHOOK_URL secret. The step is
      # strict: a missing secret or a webhook that refuses the message fails it, because an alert nobody
      # receives is worth no more than no alert at all, and only a red run makes that visible. A dry
      # run is not a real check, so it is silent.
      - name: Alert the chat channel when a pin is dead
        if: steps.check.outputs.outcome == 'failure' && inputs.dry_run != true
        env:
          PIN_ALERT_WEBHOOK_URL: ${{ secrets.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK: ${{ secrets.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
          PIN_ALERT_WEBHOOK_URL_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
          # Delivery is part of the check, not a courtesy: a channel that cannot receive is a broken
          # alarm, so this fails the step instead of warning about it.
          PIN_ALERT_STRICT: '1'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_URL: ${{ steps.report.outputs.issue_number && format('{0}/{1}/issues/{2}', github.server_url, github.repository, steps.report.outputs.issue_number) || '' }}
        run: bash scripts/notify-pin-liveness.sh failure pin-liveness.log "$RUN_URL" "$ISSUE_URL"

      # The alert is only half of it: a channel that sees a dead pin and never hears back stays red,
      # so people keep chasing a failure that was fixed. This is sent only when the report step above
      # actually closed the tracking issue, which keeps a routine weekly pass silent. A dry run never
      # closes an incident, so it stays silent here too.
      #
      # It is strict as well, and that is the case strictness exists for: this step runs on an otherwise
      # green run, so a warning here would leave a broken channel indistinguishable from a healthy week.
      - name: Tell the chat channel the pins are healthy again
        if: steps.check.outputs.outcome == 'success' && steps.report.outputs.recovered == 'true'
        env:
          PIN_ALERT_WEBHOOK_URL: ${{ secrets.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK: ${{ secrets.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
          PIN_ALERT_WEBHOOK_URL_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
          # Delivery is part of the check, not a courtesy: a channel that cannot receive is a broken
          # alarm, so this fails the step instead of warning about it.
          PIN_ALERT_STRICT: '1'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_URL: ${{ steps.report.outputs.issue_number && format('{0}/{1}/issues/{2}', github.server_url, github.repository, steps.report.outputs.issue_number) || '' }}
        run: bash scripts/notify-pin-liveness.sh success pin-liveness.log "$RUN_URL" "$ISSUE_URL"

      # The summary is what the Actions page shows without opening a log, and "is a channel configured
      # at all?" is answerable on every run - including the weeks nothing needed sending, which is
      # exactly when a silently unconfigured channel would otherwise go unnoticed. The value is never
      # printed: only whether one exists.
      - name: Record the alert channel in the job summary
        if: always()
        env:
          PIN_ALERT_WEBHOOK_URL: ${{ secrets.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK: ${{ secrets.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
          PIN_ALERT_WEBHOOK_URL_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
        run: |
          {
            echo '### Alert channel'
            if [[ -n "$PIN_ALERT_WEBHOOK_URL" ]]; then
              echo '- `PIN_ALERT_WEBHOOK_URL`: configured - alerts are delivered to the chat channel'
            elif [[ -n "$PIN_ALERT_WEBHOOK_URL_VAR" ]]; then
              echo '- `PIN_ALERT_WEBHOOK_URL`: **saved as a repository variable, not a secret** - variables never reach `secrets.*`, so move it to the Secrets tab'
            elif [[ -n "$PIN_ALERT_WEBHOOK_URL_FALLBACK" ]]; then
              echo '- `PIN_ALERT_WEBHOOK_URL`: **not configured** - alerts can only reach the fallback route'
            else
              echo '- `PIN_ALERT_WEBHOOK_URL`: **not configured** - a dead pin is reported only in the tracking issue and the Actions tab'
            fi
            if [[ -n "$PIN_ALERT_WEBHOOK_URL_FALLBACK" ]]; then
              echo '- `PIN_ALERT_WEBHOOK_URL_FALLBACK`: configured - used when the primary is missing or refuses a message'
            elif [[ -n "$PIN_ALERT_WEBHOOK_URL_FALLBACK_VAR" ]]; then
              echo '- `PIN_ALERT_WEBHOOK_URL_FALLBACK`: **saved as a repository variable, not a secret** - variables never reach `secrets.*`'
            else
              echo '- `PIN_ALERT_WEBHOOK_URL_FALLBACK`: not configured - a refused primary alert has no second route'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A channel that is not configured cannot warn about anything, and the run that would have used it
      # is already red for its own reason - so on a healthy week the silence was the only sign, and it
      # was invisible. This makes the silence itself the failure: every real run fails while no alert
      # route exists, which is what stops a missing channel drifting through a run of green weeks.
      #
      # A dry run is exempt: it exists to answer "will the schedule fire", it never reports anything,
      # and failing it for a channel it was never going to use would only muddy that answer.
      - name: Fail the run when no alert channel is configured
        if: always() && inputs.dry_run != true
        env:
          PIN_ALERT_WEBHOOK_URL: ${{ secrets.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK: ${{ secrets.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
        run: |
          if [[ -z "$PIN_ALERT_WEBHOOK_URL" && -z "$PIN_ALERT_WEBHOOK_URL_FALLBACK" ]]; then
            echo "::error title=No alert channel configured::Neither PIN_ALERT_WEBHOOK_URL nor PIN_ALERT_WEBHOOK_URL_FALLBACK is set, so a dead pin could not reach anyone. Add one under Settings - Secrets and variables - Actions - New repository secret."
            exit 1
          fi
          echo "alert channel: configured"

      # The watchdog guards this schedule, so this run guards the watchdog's: a daily watchdog whose
      # own schedule stopped would otherwise be silent in exactly the way it exists to prevent. Any
      # week this runs is a week something noticed, which is what makes two schedules enough.
      - name: Check the schedule watchdog is still running
        if: always()
        env:
          WATCH_TARGET: watchdog
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PIN_ALERT_WEBHOOK_URL: ${{ secrets.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK: ${{ secrets.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
          PIN_ALERT_WEBHOOK_URL_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/watch-pin-schedule.sh

      - name: Fail the run when a pin or the schedule is broken
        if: steps.check.outputs.outcome != 'success'
        run: exit 1
