name: android-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Pinned: the runtime hash pins depend on the patchelf version shipped with this
    # release, so a runner-image bump must be a deliberate change.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # Gradle version comes from the committed wrapper (gradle/wrapper/gradle-wrapper.properties),
      # pinned to 9.6.0 - the minimum AGP 9.4.0 accepts.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Verify full-mode runtime manifest
        run: bash tools/verify-fullmode-repair.sh
      - name: Run source security audit
        run: bash tools/security-audit.sh
      - name: Cross-check the restore path against the wallet-migration script
        run: bash scripts/verify-restore-path.sh
      - name: Unit tests
        run: ./gradlew test
      - name: Unit-test coverage
        # Fails when wallet/ or security/ coverage drops below its floor (see jacocoDebugUnitTestCoverage).
        run: ./gradlew :app:jacocoDebugUnitTestCoverage

      - name: Static analysis (detekt)
        run: ./gradlew detekt
      - name: Android Lint
        run: ./gradlew :app:lintDebug
      - name: Validate RuntimeManifest pins
        run: |
          echo 'Checking critical RuntimeManifest pins are set and valid...'
          KEYS=("PROOT_SHA256" "PROOT_LOADER_SHA256" "LIBTALLOC_SHA256" "LIBANDROID_SHMEM_SHA256")
          ALL_OK=true
          for key in "${KEYS[@]}"; do
            value=$(grep -E "const val ${key}" app/src/main/java/org/stohncoin/wallet/runtime/RuntimeManifest.kt | head -n1 | sed -E 's/.*= "([0-9a-f]+)".*/\1/')
            if [ -z "$value" ] || ! echo "$value" | grep -qE '^[0-9a-f]{64}$'; then
              echo "FAIL: $key is missing or not a valid 64-char hex"
              ALL_OK=false
            else
              echo "OK: $key=$value"
            fi
          done
          if ! $ALL_OK; then exit 1; fi
      # The version numbers are static, so a release that could not install is caught here, on the
      # pull request, rather than after the release job has spent a full build on it.
      - name: Release preflight (pins, versions, versionCode against the published baseline)
        run: bash scripts/release-preflight.sh
      - name: Build debug APK (release builds need signing secrets; see release job)
        run: ./gradlew assembleDebug

  # The release path is invisible to the rest of CI: R8, the signing configuration and the packaged
  # APK payload are exercised only by assembleRelease, which the release job runs only when the real
  # keystore secrets exist. A pull request gets the same build with a throwaway key, so a shrinker
  # rule, a pin or a packaging change cannot land broken and be discovered at release time.
  release-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # A key generated here and thrown away with the runner. It is not a release key and cannot be
      # mistaken for one: the APK it signs only exists for the length of this job.
      - name: Create a throwaway signing key
        run: |
          keystore="$RUNNER_TEMP/smoke.jks"
          password=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
            -storepass "$password" -keypass "$password" \
            -alias smoke -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Stohn CI release smoke" >/dev/null
          chmod 600 "$keystore"
          {
            echo "STOHN_RELEASE_STORE_FILE=$keystore"
            echo "STOHN_RELEASE_STORE_PASSWORD=$password"
            echo "STOHN_RELEASE_KEY_ALIAS=smoke"
            echo "STOHN_RELEASE_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Build the release APK with the throwaway key
        run: ./gradlew assembleRelease
      # The same checks the release job runs, minus the ones that need the real keystore: the payload
      # hashes, and the SBOM and checksum file that publish beside the APK.
      - name: Verify the APK runtime payload
        run: bash scripts/verify-apk-artifact.sh app/build/outputs/apk/release/app-release.apk
      - name: Generate the SBOM and check the checksums
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          bash scripts/generate-sbom.sh app/build/outputs/apk/release/app-release.apk

  # Release packaging: builds the pinned PRoot bundle, verifies it against RuntimeManifest,
  # then assembles a signed APK. Gradle itself refuses to emit an unsigned release
  # (app/build.gradle.kts taskGraph check), so the build steps only run when a keystore
  # secret is present; otherwise the job reports that the release was skipped.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    # scripts/verify-baseline-committed.sh reads the previous release's artifact through the API, so
    # the token needs actions: read; without this it inherits the repository default and the check
    # fails on scope instead of on a missing commit. Artifact upload uses the runner's own runtime
    # token, so it does not need actions: write here.
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.signing.outputs.configured }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The APK is only valid with the runtime payload: assembleRelease fails the
      # verify step below unless these four libraries are packaged into lib/arm64-v8a.
      - name: Install PRoot bundle tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf binutils dpkg-dev
          patchelf --version
      - name: Build pinned PRoot Android bundle
        run: bash scripts/build-proot-android-bundle.sh "$RUNNER_TEMP/proot-bundle"
      - name: Integrate bundle and verify hashes against RuntimeManifest
        run: bash scripts/integrate-proot-bundle.sh "$RUNNER_TEMP/proot-bundle"
      - name: Release preflight (versions, pins, native artifacts)
        run: bash scripts/release-preflight.sh
      # A committed baseline is the only record of the last release. If it is never committed, the
      # next release compares against an older one and the gap cannot be reconstructed once the
      # artifact expires, so this fails before the build rather than after it.
      - name: Check the previous release's baseline was committed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-baseline-committed.sh

      - name: Decode release keystore
        id: signing
        env:
          STORE_FILE_B64: ${{ secrets.STOHN_RELEASE_STORE_FILE_B64 }}
          # Legacy name used by the earlier workflow draft; accepted as a fallback.
          LEGACY_KEYSTORE_B64: ${{ secrets.STOHN_RELEASE_KEYSTORE_BASE64 }}
        run: |
          keystore_b64="${STORE_FILE_B64:-$LEGACY_KEYSTORE_B64}"
          if [ -z "$keystore_b64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore secret configured; skipping the signed release build."
            exit 0
          fi
          printf '%s' "$keystore_b64" | base64 -d > "$RUNNER_TEMP/stohn-release.jks"
          chmod 600 "$RUNNER_TEMP/stohn-release.jks"
          echo "STOHN_RELEASE_STORE_FILE=$RUNNER_TEMP/stohn-release.jks" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          STOHN_RELEASE_STORE_PASSWORD: ${{ secrets.STOHN_RELEASE_STORE_PASSWORD }}
          STOHN_RELEASE_KEY_ALIAS: ${{ secrets.STOHN_RELEASE_KEY_ALIAS }}
          STOHN_RELEASE_KEY_PASSWORD: ${{ secrets.STOHN_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Verify APK runtime payload against RuntimeManifest
        if: steps.signing.outputs.configured == 'true'
        run: bash scripts/verify-apk-artifact.sh app/build/outputs/apk/release/app-release.apk
      # An update that cannot install is not a release, and nothing earlier in the pipeline can see
      # that: package, signing certificate and versionCode are only knowable from the built APK.
      - name: Check the APK installs over the last release
        if: steps.signing.outputs.configured == 'true'
        run: |
          bash scripts/verify-upgrade-compatibility.sh app/build/outputs/apk/release/app-release.apk
          bash scripts/verify-upgrade-compatibility.sh app/build/outputs/apk/release/app-release.apk \
            --emit app/build/outputs/apk/release/release-baseline.json
      - name: Generate CycloneDX SBOM and checksum file
        if: steps.signing.outputs.configured == 'true'
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          bash scripts/generate-sbom.sh app/build/outputs/apk/release/app-release.apk
      # The checksum file is what makes a published APK checkable, so a release that cannot sign it
      # is not published at all: the failure here is deliberate, not a skipped step.
      - name: Decode release signing key
        if: steps.signing.outputs.configured == 'true'
        env:
          SIGNING_KEY_B64: ${{ secrets.STOHN_RELEASE_SIGNING_KEY_B64 }}
          SIGNING_KEY_FINGERPRINT: ${{ vars.STOHN_RELEASE_SIGNING_KEY_FINGERPRINT }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ]; then
            echo "::error title=Release signing key missing::The APK is signed but its checksum file cannot be. Set STOHN_RELEASE_SIGNING_KEY_B64 to the base64 of the Ed25519 private key PEM."
            exit 1
          fi
          if [ -z "$SIGNING_KEY_FINGERPRINT" ]; then
            echo "::error title=Signing key fingerprint missing::Set the repository variable STOHN_RELEASE_SIGNING_KEY_FINGERPRINT to the key's public-key SHA-256; scripts/sign-release-checksums.sh prints it."
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/stohn-release-signing-key.pem"
          chmod 600 "$RUNNER_TEMP/stohn-release-signing-key.pem"
          echo "STOHN_RELEASE_SIGNING_KEY=$RUNNER_TEMP/stohn-release-signing-key.pem" >> "$GITHUB_ENV"
          echo "STOHN_RELEASE_SIGNING_KEY_FINGERPRINT=$SIGNING_KEY_FINGERPRINT" >> "$GITHUB_ENV"
      - name: Sign the release checksum file
        if: steps.signing.outputs.configured == 'true'
        run: bash scripts/sign-release-checksums.sh app/build/outputs/apk/release/SHA256SUMS
      # The downloader's own procedure, run before anything is uploaded: if this passes with the
      # published public key and the published checksums, it passes on someone else's machine.
      - name: Verify the signature and checksums before upload
        if: steps.signing.outputs.configured == 'true'
        working-directory: app/build/outputs/apk/release
        run: |
          openssl pkeyutl -verify -pubin -inkey stohn-release-signing-key.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.signing.outputs.configured == 'true'
        with:
          name: stohn-wallet-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/stohn-wallet-*.cdx.json
            app/build/outputs/apk/release/SHA256SUMS
            app/build/outputs/apk/release/SHA256SUMS.sig
            app/build/outputs/apk/release/stohn-release-signing-key.pem
            app/build/outputs/apk/release/release-baseline.json
            runtime/release-history.json
          if-no-files-found: error

      - name: Remove the release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/stohn-release-signing-key.pem"

      - name: Report skipped release
        if: steps.signing.outputs.configured != 'true'
        run: |
          echo "::notice title=Release APK skipped::No keystore secret found. Set STOHN_RELEASE_STORE_FILE_B64 (base64-encoded keystore) together with STOHN_RELEASE_STORE_PASSWORD, STOHN_RELEASE_KEY_ALIAS and STOHN_RELEASE_KEY_PASSWORD to publish a signed APK."

  # Builds the same commit again on a second clean runner and compares it with the published APK.
  # Everything a release ships has to be a function of the commit: if two runners disagree, either
  # the build embeds something ambient (a path, a timestamp, a host-specific ordering) or a
  # dependency resolved to a different artifact. Both are release bugs worth stopping for.
  reproducibility:
    if: needs.release.outputs.signed == 'true'
    needs: [build, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install PRoot bundle tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf binutils dpkg-dev
      - name: Build pinned PRoot Android bundle
        run: bash scripts/build-proot-android-bundle.sh "$RUNNER_TEMP/proot-bundle"
      - name: Integrate bundle and verify hashes against RuntimeManifest
        run: bash scripts/integrate-proot-bundle.sh "$RUNNER_TEMP/proot-bundle"
      - name: Decode release keystore
        env:
          STORE_FILE_B64: ${{ secrets.STOHN_RELEASE_STORE_FILE_B64 }}
          LEGACY_KEYSTORE_B64: ${{ secrets.STOHN_RELEASE_KEYSTORE_BASE64 }}
        run: |
          keystore_b64="${STORE_FILE_B64:-$LEGACY_KEYSTORE_B64}"
          if [ -z "$keystore_b64" ]; then
            echo "::error title=Keystore missing::The published APK exists but this rebuild cannot sign; the two cannot be compared."
            exit 1
          fi
          printf '%s' "$keystore_b64" | base64 -d > "$RUNNER_TEMP/stohn-release.jks"
          chmod 600 "$RUNNER_TEMP/stohn-release.jks"
          echo "STOHN_RELEASE_STORE_FILE=$RUNNER_TEMP/stohn-release.jks" >> "$GITHUB_ENV"
      - name: Build the APK again
        env:
          STOHN_RELEASE_STORE_PASSWORD: ${{ secrets.STOHN_RELEASE_STORE_PASSWORD }}
          STOHN_RELEASE_KEY_ALIAS: ${{ secrets.STOHN_RELEASE_KEY_ALIAS }}
          STOHN_RELEASE_KEY_PASSWORD: ${{ secrets.STOHN_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Generate the SBOM again
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          bash scripts/generate-sbom.sh app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproducibility-rebuild
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/stohn-wallet-*.cdx.json
          if-no-files-found: error

  reproducibility-compare:
    if: needs.release.outputs.signed == 'true'
    needs: [release, reproducibility]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stohn-wallet-release-apk
          path: published
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reproducibility-rebuild
          path: rebuild
      # The two APKs carry different signatures by construction (apksigner randomises the nonce), so
      # the comparison is over what ships: entry contents, plus the SBOM's component list.
      - name: Compare the two builds
        run: |
          published_sbom=$(find published -name '*.cdx.json' -print -quit)
          rebuild_sbom=$(find rebuild -name '*.cdx.json' -print -quit)
          bash scripts/verify-reproducible-build.sh \
            published/app-release.apk rebuild/app-release.apk \
            "$published_sbom" "$rebuild_sbom"
