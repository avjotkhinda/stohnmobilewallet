name: schedule-watchdog

# pin-liveness can stop without anything going red: GitHub only schedules a workflow from the default
# branch, and disables that schedule after 60 days without repository activity. A workflow that never
# fires has no run in which to report that it never fired, so it is watched from the outside here.
#
# Daily, not weekly: a weekly watchdog would share the failure it is looking for. A stopped schedule
# is tracked in one issue and announced to the channel once, so a long outage costs one message
# rather than one per morning; the run still fails while it lasts, so the repository shows it.
#
# The same question is asked of this workflow's own daily cron, and separately by the weekly pin check,
# because a watchdog whose schedule stopped guards nothing and cannot report on itself: the run that
# would have said so never starts. Two schedules each checking the other is what keeps one silent
# schedule from being mistaken for a quiet repository.
#
# No alert channel is a warning, not a failure: a stopped schedule already fails this run and opens an
# issue by itself, so a run that is red every morning for a setting would hide the failure it exists to
# report behind a red that says nothing new. The gap is still named on every run - annotation, summary,
# and the weekly check's channel line - and alert-test stays strict, because proving delivery is its job.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Reading the workflow's state and its scheduled runs is what detects a disabled or stale schedule.
  actions: read
  # The outage is tracked in an issue that keeps the channel from repeating itself every day.
  issues: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First, because a broken self-schedule must not be hidden behind a failing pin check below: a
      # watchdog that will not run tomorrow cannot be relied on to report anything today either.
      - name: Check the watchdog's own schedule still fires
        env:
          WATCH_TARGET: watchdog
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PIN_ALERT_WEBHOOK_URL: ${{ secrets.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK: ${{ secrets.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
          PIN_ALERT_WEBHOOK_URL_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/watch-pin-schedule.sh

      # The script posts the chat message itself, because it is the only thing that knows whether this
      # is a first detection or a repeat. Exit 1 there fails this step and the run with it.
      - name: Check the weekly schedule still fires
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PIN_ALERT_WEBHOOK_URL: ${{ secrets.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK: ${{ secrets.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
          PIN_ALERT_WEBHOOK_URL_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/watch-pin-schedule.sh

      # A missing channel is a standing configuration gap, not a schedule failure, so it warns instead
      # of failing. The check above already opens an issue and exits non-zero when a schedule really
      # stops, and a run that is red every morning for a setting cannot be told apart from that failure -
      # the red stops meaning "the schedule is broken" and starts meaning "nothing to see here again".
      #
      # The gap stays visible without borrowing that signal: this annotation, the run summary with the
      # exact fix, and the weekly pin check's own channel line, on every run. A stopped schedule still
      # fails the run; only the channel is a warning.
      #
      # It runs even when a check above already failed, so the gap is named on the same run rather than
      # being hidden behind the outage that run was about.
      - name: Warn when no alert channel is configured
        if: always()
        env:
          GH_REPO: ${{ github.repository }}
          PIN_ALERT_WEBHOOK_URL: ${{ secrets.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK: ${{ secrets.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
          # A variable delivers too, so it counts here for the same reason the weekly gate counts it.
          PIN_ALERT_WEBHOOK_URL_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL }}
          PIN_ALERT_WEBHOOK_URL_FALLBACK_VAR: ${{ vars.PIN_ALERT_WEBHOOK_URL_FALLBACK }}
        run: |
          if [[ -n "$PIN_ALERT_WEBHOOK_URL" || -n "$PIN_ALERT_WEBHOOK_URL_FALLBACK" || \
                -n "$PIN_ALERT_WEBHOOK_URL_VAR" || -n "$PIN_ALERT_WEBHOOK_URL_FALLBACK_VAR" ]]; then
            echo "alert channel: configured"
            exit 0
          fi

          new_secret_url="https://github.com/${GH_REPO}/settings/secrets/actions/new"
          # The summary is what the run page shows without opening a log; the annotation is what
          # surfaces in the checks list, so the short version has to stand on its own too.
          {
            echo "## No alert channel configured"
            echo
            echo "The schedule checks above may be perfectly healthy - the only gap is the missing channel."
            echo
            echo "**Add it here:** ${new_secret_url}"
            echo
            echo "Settings -> Secrets and variables -> Actions -> **Secrets** -> **New repository secret**"
            echo
            echo '1. Name: `PIN_ALERT_WEBHOOK_URL` - exactly this, a near-miss name is not read'
            echo '2. Secret: the Slack incoming webhook URL'
            echo '3. **Add secret**, then re-run this workflow'
            echo
            echo 'It has to be a *repository* secret: this workflow declares no `environment:`, so an environment secret is invisible to it.'
            echo 'A repository *variable* of the same name also delivers, but anyone with read access can read it, so the secret is the better home.'
            echo
            echo 'Optional second route: `PIN_ALERT_WEBHOOK_URL_FALLBACK` - any webhook that accepts `{"text": ...}`.'
            echo
            echo 'To prove delivery first: Actions -> **alert-test** -> **Run workflow** posts one labelled test message and goes red if nothing arrives.'
            echo "Full setup and troubleshooting: [docs/ALERTS.md](${GITHUB_SERVER_URL:-https://github.com}/${GH_REPO}/blob/main/docs/ALERTS.md)"
            echo 'Once either name exists this step logs `alert channel: configured`; until then the schedule checks above are still reported normally.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=No alert channel configured::Set the repository secret PIN_ALERT_WEBHOOK_URL at ${new_secret_url} (Settings -> Secrets and variables -> Actions -> Secrets -> New repository secret), or the optional PIN_ALERT_WEBHOOK_URL_FALLBACK. Run the alert-test workflow to prove delivery. A stopped schedule still fails this run; only the missing channel is a warning."
          exit 0
