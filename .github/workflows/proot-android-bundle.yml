name: proot-android-bundle

# Manual dispatch: downloads the locked Termux packages, builds the PRoot Android
# bundle and verifies the produced binaries against RuntimeManifest pins.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install bundle tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf binutils python3
      - name: Build PRoot Android bundle
        run: bash scripts/build-proot-android-bundle.sh .proot-build proot-bundle
      - name: Verify PRoot bundle artifacts
        run: bash scripts/verify-proot-bundle.sh proot-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proot-android-bundle
          path: proot-bundle/
